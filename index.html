<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordly LookUp</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-4">
    <h1 class="mb-3">Wordly LookUp</h1>
    <button id="theme-btn" class="btn btn-outline-secondary mb-3">Toggle theme</button>

    <form id="search-form" class="input-group mb-3">
      <input type="text" id="word-input" class="form-control" placeholder="Type a word">
      <button type="submit" class="btn btn-primary">Search</button>
    </form>

    <p id="message" class="text-danger"></p>

    <div id="result" class="card card-body d-none"></div>
      <h2 class="mt-4">Saved words</h2>
      <ul id="saved-list" class="list-group"></ul>
    </div> 
    <script src="script.js"></script>

</body>
</html>
